name: Daily Orders Check

on:
  schedule:
    - cron: '0 5 * * *' # Every day at 5:00 UTC
  workflow_dispatch: # optional, to run manually

jobs:
  ping-cron-endpoint:
    runs-on: ubuntu-latest

    steps:
      - name: Call Hono endpoint
        env:
          CRON_ORIGIN: https://${{ secrets.SERVER_HOSTNAME }}
          CRON_KEY: ${{ secrets.DAILY_ORDER_CHECK_SECRET_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --get \
            --data-urlencode "key=${CRON_KEY}" \
            "${CRON_ORIGIN}/cron/auth/expired-orders-check"
